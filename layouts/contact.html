{{ define "main" }}
{{ partial "page-header" . }}

<section class="section-sm">
  <div class="container">
    <div class="row justify-center">
      <div class="lg:col-8">
        <h2 class="h3 mb-4">Mairie</h2>
        <p>
          {{ partial "mairie-contact-details" (dict "footer" false) }}
        </p>
        {{ with .Content }}
          <div class="content mt-10">{{ . }}</div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
